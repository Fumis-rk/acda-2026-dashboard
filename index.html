<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACDA 2026 | Grade de Treinamentos</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#182033;--muted:#6b7280;--line:#e2e5ea;--accent:#245bd6;--soft:#edf2ff;--danger:#a63a31}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}.app{max-width:1550px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:14px}
h1{margin:0;font-size:27px;letter-spacing:-.02em}.subtitle{color:var(--muted);margin-top:3px}.updated{font-size:12px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.metric span{font-size:12px;color:var(--muted)}.metric b{display:block;font-size:26px;margin-top:2px}
.filters{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:12px}.filtergrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}label{font-size:12px;color:var(--muted)}select,input{width:100%;margin-top:4px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}
.actions{display:flex;gap:7px;align-items:end}.actions button,.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:7px;margin:11px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px}.empty{text-align:center;color:var(--muted);padding:30px}
.calendar{display:grid;grid-template-columns:64px repeat(5,minmax(230px,1fr));border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff;min-width:930px}
.dayhead{height:48px;border-bottom:1px solid var(--line);padding:10px 7px;text-align:center;font-size:12px;font-weight:650;color:#4b5563;background:#fafbfc;position:sticky;top:0;z-index:4}
.timehead{border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fafbfc;position:sticky;top:0;left:0;z-index:5}
.daycol{position:relative;border-right:1px solid var(--line);min-height:1px;min-width:230px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#edf0f3 30px)}
.daycol:last-child{border-right:0}.times{position:relative;border-right:1px solid var(--line);background:#fafbfc}
.time-label{position:absolute;right:7px;transform:translateY(-7px);font-size:10px;color:#8a919d;white-space:nowrap}
.event{position:absolute;z-index:2;border-radius:8px;border:1px solid rgba(0,0,0,.10);padding:6px 7px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);font-size:11px;line-height:1.25}
.event:hover{z-index:8;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.event b{display:block;font-size:12px;margin-bottom:2px}.event .meta{opacity:.8}.event .time{font-size:10px;opacity:.78;margin-top:3px}
.mod-basquete{background:#fff0d8;border-left:4px solid #d97706}.mod-futsal{background:#e8f7ed;border-left:4px solid #16a34a}
.mod-voleibol{background:#eaf1ff;border-left:4px solid #2563eb}.mod-handebol{background:#ffe8e5;border-left:4px solid #dc2626}
.mod-tenis{background:#f1eaff;border-left:4px solid #7c3aed}.mod-outro{background:#eef0f3;border-left:4px solid #64748b}
.event.warn{background:#fff0ee!important;border-left-color:var(--danger)!important}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 9px}.legend span{font-size:10px;padding:4px 8px;border-radius:999px;background:#f0f2f5}
.detail{margin-top:11px}.detailbox{background:var(--soft);border-left:4px solid var(--accent);padding:12px;border-radius:8px}.hours{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.hour{background:#fff;border:1px solid var(--line);padding:6px 8px;border-radius:7px;font-size:11px}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;cursor:pointer}.item:hover{border-color:var(--accent)}.item.warn{background:#fff0ee;border-color:#e4b6b0}.item b{display:block;margin-bottom:3px}.item small{color:var(--muted);line-height:1.45}
.school{margin-bottom:18px}.school h2{font-size:16px;margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.badge{display:inline-block;font-size:10px;padding:3px 7px;border-radius:999px;background:var(--soft);color:var(--accent)}
@media print{body{background:#fff}.app{max-width:none;padding:0}.filters,.tabs,.detail,.updated,.metrics{display:none!important}.panel{border:0;padding:0}.calendar{min-width:0}}
@media(max-width:900px){.filtergrid{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.list,.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.app{padding:12px}.filtergrid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}header{display:block}.list,.grid{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>ACDA 2026</h1><div class="subtitle">Grade de treinamentos · visualização tipo agenda</div></div><div class="updated" id="updated">Carregando...</div></header>
<section class="metrics">
<div class="metric"><span>Turmas</span><b id="mTurmas">—</b></div><div class="metric"><span>Horários</span><b id="mHorarios">—</b></div><div class="metric"><span>Escolas</span><b id="mEscolas">—</b></div><div class="metric"><span>Incompletos</span><b id="mIncomplete">—</b></div>
</section>
<section class="filters">
<div class="filtergrid">
<label>Escola<select id="fEscola"></select></label><label>Modalidade<select id="fModalidade"></select></label><label>Categoria<select id="fCategoria"></select></label><label>Naipe<select id="fNaipe"></select></label><label>Professor<select id="fProfessor"></select></label><label>Dia<select id="fDia"></select></label>
</div>
<div style="display:grid;grid-template-columns:3fr 1fr;gap:9px;margin-top:9px"><label>Busca<input id="search" placeholder="Escola, modalidade, professor, categoria..."></label><div class="actions"><button id="clear">Limpar</button><button id="print">Imprimir</button><button id="reload">Atualizar</button></div></div>
</section>
<div class="tabs"><button class="tab active" data-view="grade">Agenda</button><button class="tab" data-view="turmas">Turmas</button><button class="tab" data-view="escolas">Escolas</button><button class="tab" data-view="alertas">Alertas</button></div>
<div id="content"></div><div class="detail" id="detail"></div>
</div>
<script src="config.js"></script>
<script>
const CFG=window.ACDA_CONFIG,days=["Segunda","Terça","Quarta","Quinta","Sexta"],$=id=>document.getElementById(id);
let turmas=[],horarios=[],view="grade";
function norm(v){return String(v??"").trim()}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function csv(t){let R=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x=='"'&&q&&n=='"'){c+='"';i++;continue}if(x=='"'){q=!q;continue}if(x==","&&!q){r.push(c);c="";continue}if((x=="\n"||x=="\r")&&!q){if(x=="\r"&&n=="\n")i++;r.push(c);c="";if(r.some(v=>v!==""))R.push(r);r=[];continue}c+=x}if(c||r.length){r.push(c);R.push(r)}return R}
function objs(t){let r=csv(t);if(!r.length)return[];let h=r[0].map(x=>norm(x).toUpperCase());return r.slice(1).map(a=>Object.fromEntries(h.map((k,i)=>[k,norm(a[i])]))).filter(o=>Object.values(o).some(Boolean))}
async function load(){try{$("updated").textContent="Atualizando...";let [a,b]=await Promise.all([fetch(CFG.turmasUrl,{cache:"no-store"}),fetch(CFG.horariosUrl,{cache:"no-store"})]);if(!a.ok||!b.ok)throw Error("Falha ao ler a planilha publicada.");let [ta,ha]=await Promise.all([a.text(),b.text()]);turmas=objs(ta).map(x=>({id:x.ID_TURMA,escola:x.ESCOLA,modalidade:x.MODALIDADE,categoria:x.CATEGORIA,naipe:x.NAIPE,professor:x.PROFESSOR,qtd:x.QTD_AULAS_SEMANA}));horarios=objs(ha).map(x=>({id:x.ID_HORARIO,turma:x.ID_TURMA,dia:x.DIA,inicio:x.HORA_INICIO,fim:x.HORA_FIM}));fill();render();$("updated").textContent="Atualizado "+new Date().toLocaleString("pt-BR")}catch(e){$("content").innerHTML='<div class="panel empty">'+esc(e.message)+'</div>';$("updated").textContent="Erro ao carregar"}}
function vals(k){return [...new Set(turmas.map(t=>t[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"))}function opts(id,a,f){$(id).innerHTML="<option>"+f+"</option>"+a.map(v=>"<option>"+esc(v)+"</option>").join("")}
function fill(){opts("fEscola",vals("escola"),"Todas");opts("fModalidade",vals("modalidade"),"Todas");opts("fCategoria",vals("categoria"),"Todas");opts("fNaipe",vals("naipe"),"Todos");opts("fProfessor",vals("professor"),"Todos");opts("fDia",days,"Todos")}
function selected(){let f={escola:$("fEscola").value,modalidade:$("fModalidade").value,categoria:$("fCategoria").value,naipe:$("fNaipe").value,professor:$("fProfessor").value},d=$("fDia").value,q=$("search").value.toLowerCase().trim();return turmas.filter(t=>Object.entries(f).every(([k,v])=>v==="Todas"||v==="Todos"||t[k]===v)&&(!q||Object.values(t).join(" ").toLowerCase().includes(q))&&(d==="Todos"||horarios.some(h=>h.turma===t.id&&h.dia===d)))}
function incomplete(t){return !t.modalidade||!t.categoria||!t.naipe||!t.professor||!horarios.some(h=>h.turma===t.id)}
function mmin(x){let p=String(x).split(":").map(Number);return p.length>1?p[0]*60+p[1]:-1}
function modClass(n){n=(n||"").toLowerCase();if(n.includes("basquete"))return"mod-basquete";if(n.includes("futsal"))return"mod-futsal";if(n.includes("voleibol")||n.includes("vôlei"))return"mod-voleibol";if(n.includes("handebol"))return"mod-handebol";if(n.includes("mesa"))return"mod-tenis";return"mod-outro"}
function overlap(a,b){let a1=mmin(a.inicio),a2=mmin(a.fim),b1=mmin(b.inicio),b2=mmin(b.fim);return a1<b2&&b1<a2}
function layoutDay(events){
  // Interval partitioning: every event gets its own horizontal lane
  // while it overlaps another event. The lane is released when the
  // previous event ends, so unrelated events can reuse the same lane.
  events.sort((a,b)=>mmin(a.h.inicio)-mmin(b.h.inicio)||mmin(a.h.fim)-mmin(b.h.fim));
  const lanes=[];

  events.forEach(e=>{
    const start=mmin(e.h.inicio);
    let lane=0;
    while(lanes[lane]!==undefined && lanes[lane] > start) lane++;
    e.col=lane;
    lanes[lane]=mmin(e.h.fim);
    e.total=Math.max(1, lanes.length);
  });

  // Recalculate the number of lanes for each overlap cluster.
  for(let i=0;i<events.length;i++){
    const e=events[i], start=mmin(e.h.inicio), end=mmin(e.h.fim);
    const concurrent=events.filter(x=>{
      const xs=mmin(x.h.inicio), xe=mmin(x.h.fim);
      return xs < end && start < xe;
    });
    e.total=Math.max(1,...concurrent.map(x=>x.col+1));
  }
  return events;
}
function eventHTML(t,h,top,height,col,total){
  return `<div class="event ${modClass(t.modalidade)} ${incomplete(t)?"warn":""}" data-id="${esc(t.id)}" style="top:${top}px;height:${Math.max(height,28)}px;left:calc(${(col/total)*100}% + 3px);width:calc(${(1/total)*100}% - 6px)"><b>${esc(t.modalidade||"Cadastro incompleto")}</b><div class="meta">${esc(t.categoria||"")} · ${esc(t.naipe||"")}<br>${esc(t.escola)}</div><div class="time">${esc(h.inicio)}–${esc(h.fim)}</div></div>`;
}
function renderGrade(ts){
  const ids=new Set(ts.map(t=>t.id)),hs=horarios.filter(h=>ids.has(h.turma)&&days.includes(h.dia));
  if(!hs.length){$("content").innerHTML='<div class="panel empty">Nenhum horário encontrado.</div>';return}
  const scale=1.0, start=Math.min(...hs.map(h=>mmin(h.inicio))),end=Math.max(...hs.map(h=>mmin(h.fim))),step=60,height=(end-start)*scale+55;
  let header='<div class="calendar"><div class="dayhead timehead"></div>'+days.map(d=>`<div class="dayhead">${d}</div>`).join("")+`<div class="times" style="height:${height}px">`;
  for(let m=Math.floor(start/60)*60;m<=end;m+=step)header+=`<span class="time-label" style="top:${(m-start)*scale}px">${String(Math.floor(m/60)).padStart(2,"0")}:00</span>`;
  header+='</div>';
  days.forEach(day=>{let ev=hs.filter(h=>h.dia===day).map(h=>({h,t:ts.find(t=>t.id===h.turma)})).filter(x=>x.t);ev=layoutDay(ev);header+=`<div class="daycol" style="height:${height}px">`;
    ev.forEach(e=>{let top=(mmin(e.h.inicio)-start)*scale,height=(mmin(e.h.fim)-mmin(e.h.inicio))*scale;header+=eventHTML(e.t,e.h,top,height,e.col,e.total)});header+='</div>'});
  header+='</div>';
  $("content").innerHTML='<div class="panel" style="overflow-x:auto"><div class="legend"><span>As aulas ocupam o espaço proporcional à duração.</span><span>Horários simultâneos ficam lado a lado.</span><span>Role horizontalmente para ver todos os blocos.</span><span>⚠ cadastro incompleto</span></div>'+header+'</div>';bind();
}
function detail(t){let hs=horarios.filter(h=>h.turma===t.id);$("detail").innerHTML=`<div class="detailbox"><b>${esc(t.id)} · ${esc(t.escola)}</b><br><b>${esc(t.modalidade||"Cadastro incompleto")}</b> · ${esc(t.categoria||"")} · ${esc(t.naipe||"")}<br>Professor: ${esc(t.professor||"Não informado")}<div class="hours">${hs.map(h=>`<span class="hour">${esc(h.dia)} · ${esc(h.inicio)}–${esc(h.fim)}</span>`).join("")||"<span class='hour'>Sem horário</span>"}</div></div>`}
function renderList(ts){$("content").innerHTML='<div class="list">'+ts.map(t=>`<div class="item ${incomplete(t)?"warn":""}" data-id="${esc(t.id)}"><b>${esc(t.id)} · ${esc(t.modalidade||"Cadastro incompleto")}</b>${esc(t.escola)}<br><small>${esc([t.categoria,t.naipe,t.professor].filter(Boolean).join(" · "))}</small><br><small>${horarios.filter(h=>h.turma===t.id).map(h=>`${h.dia} ${h.inicio}–${h.fim}`).join(" | ")||"Sem horário"}</small></div>`).join("")+'</div>';bind()}
function renderSchools(ts){let g={};ts.forEach(t=>(g[t.escola]??=[]).push(t));$("content").innerHTML=Object.entries(g).map(([s,a])=>`<section class="school"><h2>${esc(s)} <span class="badge">${a.length} turmas</span></h2><div class="grid">${a.map(t=>`<div class="item ${incomplete(t)?"warn":""}" data-id="${esc(t.id)}"><b>${esc(t.modalidade||"Cadastro incompleto")}</b>${esc([t.categoria,t.naipe].filter(Boolean).join(" · "))}<br><small>${esc(t.professor||"Professor não informado")}</small></div>`).join("")}</div></section>`).join("")}
function alerts(ts){let inc=ts.filter(incomplete);$("content").innerHTML=`<div class="list"><div class="item ${inc.length?"warn":""}"><b>Cadastros incompletos</b><small>${inc.length?inc.map(t=>`${esc(t.id)} · ${esc(t.escola)}`).join("<br>"):"Nenhum"}</small></div></div>`}
function bind(){document.querySelectorAll("[data-id]").forEach(e=>e.addEventListener("click",()=>{let t=turmas.find(x=>x.id===e.dataset.id);if(t)detail(t)}))}
function render(){let ts=selected(),hs=horarios.filter(h=>ts.some(t=>t.id===h.turma));$("mTurmas").textContent=ts.length;$("mHorarios").textContent=hs.length;$("mEscolas").textContent=new Set(ts.map(t=>t.escola)).size;$("mIncomplete").textContent=ts.filter(incomplete).length;if(view==="grade")renderGrade(ts);else if(view==="turmas")renderList(ts);else if(view==="escolas")renderSchools(ts);else alerts(ts)}
["fEscola","fModalidade","fCategoria","fNaipe","fProfessor","fDia","search"].forEach(id=>$(id).addEventListener("input",render));
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}));
$("clear").onclick=()=>{["fEscola","fModalidade","fCategoria","fNaipe","fProfessor","fDia"].forEach(id=>$(id).selectedIndex=0);$("search").value="";render()};$("print").onclick=()=>window.print();$("reload").onclick=load;load();
</script>
</body></html>
