<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACDA 2026 | Dashboard</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--text:#182033;--muted:#697386;--line:#dfe4eb;
  --accent:#1f5bd6;--accent2:#eaf0ff;--danger:#a83b32;--dangerbg:#fff0ee;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit}.app{max-width:1500px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}.subtitle{color:var(--muted);margin-top:4px}.updated{font-size:12px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.metric,.filters,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}
.metric{padding:15px}.metric span{font-size:12px;color:var(--muted)}.metric b{display:block;font-size:28px;margin-top:3px}
.filters{padding:14px;margin-bottom:12px}.filtergrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
label{font-size:12px;color:var(--muted)}select,input{width:100%;margin-top:5px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}
.actions{display:flex;gap:8px;align-items:end}.actions button,.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.actions button:hover,.tab:hover{border-color:var(--accent)}
.tabs{display:flex;gap:7px;margin:12px 0}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{padding:12px}.scroll{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:5px;min-width:900px}th{font-size:12px;padding:7px;text-align:center;color:var(--muted)}td{vertical-align:top;min-width:145px}
.time{width:70px}.slot{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:5px;background:#fff;cursor:pointer;border-left:4px solid var(--accent)}
.slot:hover{background:var(--accent2)}.slot strong{display:block;font-size:13px}.slot small{color:var(--muted);line-height:1.45}
.slot.warn{background:var(--dangerbg);border-color:#e4b6b0;border-left-color:var(--danger)}
.badge{display:inline-block;font-size:10px;border-radius:999px;padding:3px 7px;background:var(--accent2);color:var(--accent);margin-top:5px}.badge.warn{background:#ffe0db;color:var(--danger)}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;background:#fff}.item:hover{border-color:var(--accent)}
.item.warn{background:var(--dangerbg);border-color:#e4b6b0}.item b{display:block;margin-bottom:4px}.item small{color:var(--muted);line-height:1.5}
.school{margin-bottom:20px}.school h2{font-size:17px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.detail{margin-top:12px}.detailbox{background:var(--accent2);border-left:4px solid var(--accent);padding:12px;border-radius:8px}
.detailbox .hours{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}.hour{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
.empty{text-align:center;color:var(--muted);padding:28px}.error{background:var(--dangerbg);border:1px solid #e4b6b0;color:var(--danger);padding:14px;border-radius:10px}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}.legend span{font-size:11px;padding:4px 8px;border-radius:999px;background:#f0f2f6}
@media print{
 body{background:#fff}.app{max-width:none;padding:0}.filters,.tabs,.actions,.detail,.updated{display:none!important}
 .metrics{grid-template-columns:repeat(4,1fr)}.panel{border:0;padding:0}.scroll{overflow:visible}table{min-width:0}
}
@media(max-width:950px){.filtergrid{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.list,.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.app{padding:13px}header{display:block}.filtergrid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.list,.grid{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>ACDA 2026</h1><div class="subtitle">Turmas e horários de treinamento</div></div>
  <div class="updated" id="updated">Carregando dados...</div>
</header>

<section class="metrics">
  <div class="metric"><span>Turmas</span><b id="mTurmas">—</b></div>
  <div class="metric"><span>Horários</span><b id="mHorarios">—</b></div>
  <div class="metric"><span>Escolas</span><b id="mEscolas">—</b></div>
  <div class="metric"><span>Cadastros incompletos</span><b id="mIncomplete">—</b></div>
</section>

<section class="filters">
  <div class="filtergrid">
    <label>Escola<select id="fEscola"></select></label>
    <label>Modalidade<select id="fModalidade"></select></label>
    <label>Categoria<select id="fCategoria"></select></label>
    <label>Naipe<select id="fNaipe"></select></label>
    <label>Professor<select id="fProfessor"></select></label>
    <label>Dia<select id="fDia"></select></label>
  </div>
  <div class="filtergrid" style="margin-top:10px;grid-template-columns:1fr 1fr 1fr 3fr">
    <label>Busca<input id="search" placeholder="Digite escola, modalidade, professor, categoria..."></label>
    <div></div><div></div>
    <div class="actions">
      <button id="clear">Limpar filtros</button>
      <button id="print">Imprimir grade</button>
      <button id="reload">Atualizar dados</button>
    </div>
  </div>
</section>

<div class="tabs">
  <button class="tab active" data-view="grade">Grade semanal</button>
  <button class="tab" data-view="turmas">Turmas</button>
  <button class="tab" data-view="escolas">Escolas</button>
  <button class="tab" data-view="alertas">Alertas</button>
</div>

<div id="content"></div>
<div class="detail" id="detail"></div>
</div>

<script src="config.js"></script>
<script>
const CFG=window.ACDA_CONFIG;
let turmas=[],horarios=[],view="grade";
const days=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const $=id=>document.getElementById(id);

function norm(v){return String(v??"").trim()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function csv(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c=='"'&&q&&n=='"'){cell+='"';i++;continue}
    if(c=='"'){q=!q;continue}
    if(c==","&&!q){row.push(cell);cell="";continue}
    if((c=="\n"||c=="\r")&&!q){if(c=="\r"&&n=="\n")i++;row.push(cell);cell="";if(row.some(x=>x!==""))rows.push(row);row=[];continue}
    cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function objects(text){
  const r=csv(text);if(!r.length)return[];
  const h=r[0].map(x=>norm(x).toUpperCase());
  return r.slice(1).map(a=>Object.fromEntries(h.map((k,i)=>[k,norm(a[i])]))).filter(o=>Object.values(o).some(Boolean));
}
async function fetchCsv(url){
  const res=await fetch(url,{cache:"no-store"});
  if(!res.ok)throw new Error("Não foi possível ler os dados publicados.");
  return res.text();
}
async function load(){
  try{
    $("updated").textContent="Atualizando...";
    const [t,h]=await Promise.all([fetchCsv(CFG.turmasUrl),fetchCsv(CFG.horariosUrl)]);
    turmas=objects(t).map(x=>({id:x.ID_TURMA,escola:x.ESCOLA,modalidade:x.MODALIDADE,categoria:x.CATEGORIA,naipe:x.NAIPE,professor:x.PROFESSOR,qtd:x.QTD_AULAS_SEMANA}));
    horarios=objects(h).map(x=>({id:x.ID_HORARIO,turma:x.ID_TURMA,dia:x.DIA,inicio:x.HORA_INICIO,fim:x.HORA_FIM}));
    fillFilters();render();
    $("updated").textContent="Atualizado em "+new Date().toLocaleString("pt-BR");
  }catch(e){$("updated").textContent="Erro ao carregar";$("content").innerHTML='<div class="error"><b>Não foi possível carregar a planilha.</b><br>'+esc(e.message)+'</div>'}
}
function unique(k){return [...new Set(turmas.map(t=>t[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"))}
function setOptions(id,vals,first){$(id).innerHTML="<option>"+first+"</option>"+vals.map(v=>"<option>"+esc(v)+"</option>").join("")}
function fillFilters(){
  setOptions("fEscola",unique("escola"),"Todas");setOptions("fModalidade",unique("modalidade"),"Todas");
  setOptions("fCategoria",unique("categoria"),"Todas");setOptions("fNaipe",unique("naipe"),"Todos");
  setOptions("fProfessor",unique("professor"),"Todos");setOptions("fDia",days,"Todos");
}
function selected(){
  const f={escola:$("fEscola").value,modalidade:$("fModalidade").value,categoria:$("fCategoria").value,naipe:$("fNaipe").value,professor:$("fProfessor").value,dia:$("fDia").value};
  const q=$("search").value.toLowerCase().trim();
  return turmas.filter(t=>{
    const ok=Object.entries(f).every(([k,v])=>v==="Todas"||v==="Todos"||t[k]===v);
    const text=Object.values(t).join(" ").toLowerCase();
    const has=q?text.includes(q):true;
    const dayOk=f.dia==="Todos"||horarios.some(h=>h.turma===t.id&&h.dia===f.dia);
    return ok&&has&&dayOk;
  });
}
function isIncomplete(t){
  return !t.modalidade||!t.categoria||!t.naipe||!t.professor||!horarios.some(h=>h.turma===t.id);
}
function conflictIds(){
  const bad=new Set();
  const by={};
  horarios.forEach(h=>{const t=turmas.find(x=>x.id===h.turma);if(!t||!t.professor)return;const key=t.professor+"|"+h.dia;(by[key]??=[]).push({h,t})});
  Object.values(by).forEach(arr=>{
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
      if(overlap(arr[i].h,arr[j].h)){bad.add(arr[i].t.id);bad.add(arr[j].t.id)}
    }
  });
  return bad;
}
function mins(x){const p=String(x).split(":").map(Number);return p.length>=2?p[0]*60+p[1]:-1}
function overlap(a,b){const a1=mins(a.inicio),a2=mins(a.fim),b1=mins(b.inicio),b2=mins(b.fim);return a1>=0&&a2>=0&&b1>=0&&b2>=0&&a1<b2&&b1<a2}
function detail(t){
  const hs=horarios.filter(h=>h.turma===t.id);
  const conflict=conflictIds().has(t.id);
  $("detail").innerHTML=`<div class="detailbox"><b>${esc(t.id)} · ${esc(t.escola)}</b><br><b>${esc(t.modalidade||"Cadastro incompleto")}</b> · ${esc(t.categoria||"")} · ${esc(t.naipe||"")}<br>Professor: ${esc(t.professor||"Não informado")}<div class="hours">${hs.map(h=>`<span class="hour">${esc(h.dia)} · ${esc(h.inicio)}–${esc(h.fim)}</span>`).join("")||"<span class='hour'>Sem horário cadastrado</span>"}</div>${conflict?'<div class="badge warn">⚠ conflito de horário do professor</div>':""}</div>`;
}
function slot(t,h){
  const bad=isIncomplete(t),conf=conflictIds().has(t.id);
  return `<div class="slot ${bad?"warn":""}" data-id="${esc(t.id)}"><strong>${esc(t.modalidade||"Cadastro incompleto")}</strong><small>${esc([t.categoria,t.naipe].filter(Boolean).join(" · "))}<br>${esc(t.escola)}<br>${esc(h.inicio)}–${esc(h.fim)}${conf?"<br>⚠ conflito do professor":""}</small>${bad?'<span class="badge warn">Cadastro incompleto</span>':""}</div>`;
}
function renderGrade(ts){
  const ids=new Set(ts.map(t=>t.id));const hs=horarios.filter(h=>ids.has(h.turma));
  const times=[...new Set(hs.map(h=>h.inicio))].sort();
  if(!times.length){$("content").innerHTML='<div class="panel empty">Nenhum horário encontrado.</div>';return}
  let s='<div class="panel scroll"><div class="legend"><span>Blocos = turmas</span><span>⚠ = cadastro incompleto ou conflito</span></div><table><thead><tr><th>Horário</th>'+days.map(d=>`<th>${d}</th>`).join("")+'</tr></thead><tbody>';
  times.forEach(time=>{s+=`<tr><th class="time">${esc(time)}</th>`+days.map(day=>`<td>${hs.filter(h=>h.inicio===time&&h.dia===day).map(h=>slot(ts.find(t=>t.id===h.turma),h)).join("")||'<div class="empty">—</div>'}</td>`).join("")+"</tr>"});
  $("content").innerHTML=s+"</tbody></table></div>";bind();
}
function renderTurmas(ts){
  const conflicts=conflictIds();
  $("content").innerHTML='<div class="list">'+ts.map(t=>`<div class="item ${isIncomplete(t)||conflicts.has(t.id)?"warn":""}" data-id="${esc(t.id)}"><b>${esc(t.id)} · ${esc(t.modalidade||"Cadastro incompleto")}</b>${esc(t.escola)}<br><small>${esc([t.categoria,t.naipe,t.professor].filter(Boolean).join(" · "))}</small><br><small>${horarios.filter(h=>h.turma===t.id).map(h=>`${esc(h.dia)} ${esc(h.inicio)}–${esc(h.fim)}`).join(" | ")||"Sem horário"}</small></div>`).join("")+'</div>';bind();
}
function renderEscolas(ts){
  const g={};ts.forEach(t=>(g[t.escola]??=[]).push(t));
  $("content").innerHTML=Object.entries(g).map(([s,a])=>`<section class="school"><h2>${esc(s)} <span class="badge">${a.length} turmas</span></h2><div class="grid">${a.map(t=>`<div class="item ${isIncomplete(t)?"warn":""}" data-id="${esc(t.id)}"><b>${esc(t.modalidade||"Cadastro incompleto")}</b>${esc([t.categoria,t.naipe].filter(Boolean).join(" · "))}<br><small>${esc(t.professor||"Professor não informado")}</small></div>`).join("")}</div></section>`).join("")||'<div class="panel empty">Nenhuma escola encontrada.</div>';bind();
}
function renderAlertas(ts){
  const conflicts=conflictIds();
  const inc=ts.filter(isIncomplete),con=ts.filter(t=>conflicts.has(t.id));
  $("content").innerHTML=`<div class="list"><div class="item ${inc.length?"warn":""}"><b>Cadastros incompletos</b><small>${inc.length?inc.map(t=>`${esc(t.id)} · ${esc(t.escola)}`).join("<br>"):"Nenhum"}</small></div><div class="item ${con.length?"warn":""}"><b>Conflitos de professor</b><small>${con.length?con.map(t=>`${esc(t.id)} · ${esc(t.professor)}`).join("<br>"):"Nenhum"}</small></div></div>`;
  if(inc.length||con.length){$("content").insertAdjacentHTML("beforeend",'<div class="panel" style="margin-top:10px"><small>Um conflito significa que o mesmo professor aparece em dois horários sobrepostos no mesmo dia.</small></div>')}
}
function bind(){document.querySelectorAll("[data-id]").forEach(e=>e.addEventListener("click",()=>{const t=turmas.find(x=>x.id===e.dataset.id);if(t)detail(t)}))}
function render(){
  const ts=selected(),hs=horarios.filter(h=>ts.some(t=>t.id===h.turma));
  $("mTurmas").textContent=ts.length;$("mHorarios").textContent=hs.length;$("mEscolas").textContent=new Set(ts.map(t=>t.escola)).size;$("mIncomplete").textContent=ts.filter(isIncomplete).length;
  if(view==="grade")renderGrade(ts);else if(view==="turmas")renderTurmas(ts);else if(view==="escolas")renderEscolas(ts);else renderAlertas(ts);
}
["fEscola","fModalidade","fCategoria","fNaipe","fProfessor","fDia","search"].forEach(id=>$(id).addEventListener("input",render));
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.view;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}));
$("clear").addEventListener("click",()=>{["fEscola","fModalidade","fCategoria","fNaipe","fProfessor","fDia"].forEach(id=>$(id).selectedIndex=0);$("search").value="";render()});
$("print").addEventListener("click",()=>window.print());
$("reload").addEventListener("click",load);
load();
</script>
</body>
</html>
